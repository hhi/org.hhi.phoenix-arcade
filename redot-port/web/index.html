<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoenix — browser edition</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Phoenix</h1>
    <div class="cabinet">
      <canvas id="phoenix-screen" width="416" height="512" aria-label="Phoenix game screen"></canvas>
      <button id="start-audio" type="button">Click to start</button>
    </div>
    <p>C: insert coin · 1/Enter: 1 player · 2: 2 players · ←/→ or A/D: move · Space/Z: fire · Shift/X: shield</p>
    <p id="status" role="status">Loading the WebAssembly core…</p>
  </main>
  <script type="module" src="./main.js"></script>
