<svg width="760" height="452" viewBox="0 0 760 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="De twee werkwijzen van C2-Phoenix. In native modus deelt hij de C-Phoenix-spelengine en vervangt hij alleen de renderer. In replaymodus wordt een RAM-dump eenmalig omgezet naar een semantisch JSON-bestand, waarna de viewer geen ROM, ruwe adressen of graphics meer nodig heeft.">
  <title>Hoe C2-Phoenix zich verhoudt tot C-Phoenix</title>
  <style>
    .bg    { fill:#050510; }
    .h1    { fill:#E8E8FF; font-family:'Segoe UI',system-ui,sans-serif; font-size:18px; font-weight:600; }
    .sub   { fill:#8888AA; font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; }
    .mode  { font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; font-weight:600; letter-spacing:.3px; }
    .box   { fill:#0C0C1E; stroke:#2A2A4A; stroke-width:1.5; }
    .shared{ fill:#0E2420; stroke:#1E6B55; stroke-width:1.5; }
    .c2    { fill:#26141E; stroke:#8A3A5A; stroke-width:1.5; }
    .name  { fill:#DDDDEE; font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; font-weight:600; }
    .what  { fill:#9999BB; font-family:'Segoe UI',system-ui,sans-serif; font-size:10.5px; }
    .file  { fill:#FFFF66; font-family:monospace; font-size:10.5px; }
    .note  { fill:#777799; font-family:'Segoe UI',system-ui,sans-serif; font-size:11.5px; }
    .no    { fill:#CC6677; font-family:'Segoe UI',system-ui,sans-serif; font-size:11px; }
    .arrow { fill:none; stroke:#4A4A7A; stroke-width:2; marker-end:url(#a2); }
    .cut   { fill:none; stroke:#8A3A5A; stroke-width:2; stroke-dasharray:6 5; }
  </style>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4A4A7A" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="452" rx="10" />

  <text class="h1"  x="26" y="32">C2-Phoenix: hetzelfde spel, ander beeld</text>
  <text class="sub" x="26" y="52">Hij emuleert nooit hardware en leest nooit de graphics-ROM. Er zijn twee modi, die verschillende dingen lenen.</text>

  <!-- legend -->
  <rect class="shared" x="26" y="66" width="12" height="12" rx="2" />
  <text class="what" x="44" y="76">gedeeld met C-Phoenix</text>
  <rect class="c2" x="196" y="66" width="12" height="12" rx="2" />
  <text class="what" x="214" y="76">eigen werk van C2</text>

  <!-- ══ MODE A: native ══ -->
  <text class="mode" x="26" y="108" fill="#4ECCA8">MODUS A — NATIVE: SPELEN</text>
  <text class="what" x="240" y="108">make run · dezelfde spelregels, opnieuw getekend</text>

  <rect class="shared" x="26" y="120" width="180" height="72" rx="8" />
  <text class="name" x="40" y="142">C-Phoenix-spelengine</text>
  <text class="what" x="40" y="160">regels, invoer, timing, geluid,</text>
  <text class="what" x="40" y="175">bewegingstabellen — ongewijzigd</text>

  <path class="arrow" d="M 210,156 L 244,156" />

  <rect class="c2" x="248" y="120" width="180" height="72" rx="8" />
  <text class="name" x="262" y="142" fill="#EEBBCC">C2-renderer</text>
  <text class="what" x="262" y="160" fill="#CC9FB0">16×16 hi-res-glyphs in plaats</text>
  <text class="what" x="262" y="175" fill="#CC9FB0">van de originele 8×8-tegels</text>

  <path class="arrow" d="M 432,156 L 466,156" />

  <rect class="box" x="470" y="120" width="264" height="72" rx="8" />
  <text class="name" x="484" y="142">Een venster om in te spelen</text>
  <text class="what" x="484" y="160">Zelfde gedrag als de klassieke poort —</text>
  <text class="what" x="484" y="175">hij doorstaat dezelfde geheugencontroles.</text>

  <!-- ══ MODE B: replay ══ -->
  <text class="mode" x="26" y="234" fill="#DD88AA">MODUS B — REPLAY: ONDERZOEKEN</text>
  <text class="what" x="292" y="234">make demo-view · een opgenomen sessie, in de browser</text>

  <rect class="box" x="26" y="246" width="148" height="76" rx="8" />
  <text class="name" x="40" y="268" font-size="11.5">Een opgenomen sessie</text>
  <text class="what" x="40" y="286">ruw geheugen uit C-Phoenix</text>
  <text class="what" x="40" y="300">of uit de emulator</text>
  <text class="file" x="40" y="316">port_….bin</text>

  <path class="arrow" d="M 178,284 L 208,284" />

  <rect class="c2" x="212" y="246" width="148" height="76" rx="8" />
  <text class="name" x="226" y="268" font-size="11.5" fill="#EEBBCC">Eenmalig omgezet</text>
  <text class="what" x="226" y="286" fill="#CC9FB0">adressen worden namen:</text>
  <text class="what" x="226" y="300" fill="#CC9FB0">score, levens, vogels</text>
  <text class="file" x="226" y="316">semantic .json</text>

  <path class="arrow" d="M 364,284 L 394,284" />

  <rect class="box" x="398" y="246" width="148" height="76" rx="8" />
  <text class="name" x="412" y="268" font-size="11.5">De viewer</text>
  <text class="what" x="412" y="286">score, levens, niveauwissels,</text>
  <text class="what" x="412" y="300">gebeurtenissen per frame</text>
  <text class="file" x="412" y="316">.html</text>

  <!-- the boundary -->
  <path class="cut" d="M 380,238 L 380,336" />
  <text class="no" x="558" y="266">De viewer heeft niet meer nodig:</text>
  <text class="no" x="558" y="284" fill="#AA8899">· de ROMs</text>
  <text class="no" x="558" y="300" fill="#AA8899">· ruwe geheugenadressen</text>
  <text class="no" x="558" y="316" fill="#AA8899">· graphics- of kleurdata</text>

  <text class="note" x="26" y="366">Die grens is het punt van modus B: zodra een sessie is omgezet, is alles erna gewone, zelfbeschrijvende data.</text>
  <text class="note" x="26" y="386">Het contract voor dat bestand staat in SEMANTIC-FRAME.md; de tekenwijze zelf in NATIVE-ART.nl.md.</text>
  <text class="note" x="26" y="414">C2 is een presentatielaag, geen tweede implementatie: hij wijzigt geen spelcode en vervangt de geheugencontroles niet.</text>
</svg>
