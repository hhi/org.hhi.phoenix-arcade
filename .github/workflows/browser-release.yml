name: Browser release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-browser-package:
    name: Build and upload browser package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build browser package
        run: make web-package

      - name: Attach browser package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" browser-port/build/phoenix-browser.zip --clobber
