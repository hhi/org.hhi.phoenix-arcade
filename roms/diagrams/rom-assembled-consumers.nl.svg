<svg width="100%" viewBox="0 0 680 256" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Afnemers van roms/assembled</title>
<desc>roms/assembled/*.rom vertakt naar drie afnemers: jphoenix laadt de images rechtstreeks, en twee generatorscripts zetten ze om naar C-broncode voor c-phoenix.</desc>
<style>
  :root {
    --box-fill: #eef1f4; --box-stroke: #94a3b8;
    --box-fill2: #dbeafe; --box-stroke2: #60a5fa;
    --box-fill3: #dcfce7; --box-stroke3: #4ade80;
    --text: #1a2129; --text-muted: #5b6b78; --line: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --box-fill: #1c2530; --box-stroke: #475569;
      --box-fill2: #1e3a5f; --box-stroke2: #60a5fa;
      --box-fill3: #14532d; --box-stroke3: #4ade80;
      --text: #e2e8f0; --text-muted: #94a3b8; --line: #94a3b8;
    }
  }
  .box { fill: var(--box-fill); stroke: var(--box-stroke); }
  .box-blue { fill: var(--box-fill2); stroke: var(--box-stroke2); }
  .box-green { fill: var(--box-fill3); stroke: var(--box-stroke3); }
  .th { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: var(--text); }
  .ts { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: var(--text-muted); }
  .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect class="box" x="180" y="40" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="59.0" text-anchor="middle" dominant-baseline="central">roms/assembled/*.rom</text>
<text class="ts" x="340.0" y="77.0" text-anchor="middle" dominant-baseline="central">program.rom, graphics.rom, proms.rom</text>
<line x1="240" y1="96" x2="135" y2="180" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="180" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="96" x2="545" y2="180" class="arr" marker-end="url(#arrow)"/>
<rect class="box-blue" x="40" y="180" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="135.0" y="199.0" text-anchor="middle" dominant-baseline="central">jphoenix</text>
<text class="ts" x="135.0" y="217.0" text-anchor="middle" dominant-baseline="central">Rechtstreeks geladen</text>
<rect class="box-blue" x="245" y="180" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="199.0" text-anchor="middle" dominant-baseline="central">render-assetgenerators</text>
<text class="ts" x="340.0" y="217.0" text-anchor="middle" dominant-baseline="central">-> tiles, RGB-palet, hires-atlas</text>
<rect class="box-blue" x="450" y="180" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545.0" y="199.0" text-anchor="middle" dominant-baseline="central">gen-phoenix-tables.py</text>
<text class="ts" x="545.0" y="217.0" text-anchor="middle" dominant-baseline="central">-> phoenix_tables.c</text>
</svg>
