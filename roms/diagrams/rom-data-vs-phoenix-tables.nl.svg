<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Welke binary heeft welk bronbestand nodig</title>
<desc>Beide renderers lezen de samengestelde graphics- en palette-ROMs alleen tijdens het bouwen om runtime-assets te genereren. Hun binaries bevatten phoenix_tables.c en gegenereerde assets, maar geen ruwe ROM-arrays.</desc>
<style>
  :root {
    --box-fill: #eef1f4; --box-stroke: #94a3b8;
    --box-fill2: #dbeafe; --box-stroke2: #60a5fa;
    --box-fill3: #dcfce7; --box-stroke3: #4ade80;
    --text: #1a2129; --text-muted: #5b6b78; --line: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --box-fill: #1c2530; --box-stroke: #475569;
      --box-fill2: #1e3a5f; --box-stroke2: #60a5fa;
      --box-fill3: #14532d; --box-stroke3: #4ade80;
      --text: #e2e8f0; --text-muted: #94a3b8; --line: #94a3b8;
    }
  }
  .box { fill: var(--box-fill); stroke: var(--box-stroke); }
  .box-blue { fill: var(--box-fill2); stroke: var(--box-stroke2); }
  .box-green { fill: var(--box-fill3); stroke: var(--box-stroke3); }
  .th { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: var(--text); }
  .ts { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: var(--text-muted); }
  .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect class="box" x="40" y="30" width="280" height="260" rx="20" stroke-width="0.5"/>
<text class="th" x="180" y="52" text-anchor="middle" dominant-baseline="central">c-phoenix</text>
<text class="ts" x="180" y="70" text-anchor="middle" dominant-baseline="central">authentieke build</text>
<rect class="box" x="360" y="30" width="280" height="260" rx="20" stroke-width="0.5"/>
<text class="th" x="500" y="52" text-anchor="middle" dominant-baseline="central">c2-phoenix</text>
<text class="ts" x="500" y="70" text-anchor="middle" dominant-baseline="central">hires-renderer build</text>
<rect class="box-blue" x="60" y="90" width="240" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="180.0" y="118" text-anchor="middle" dominant-baseline="central">gegenereerde tiles + RGB-palet</text>
<text class="ts" x="180.0" y="138" text-anchor="middle" dominant-baseline="central">uit graphics.rom + proms.rom</text>
<text class="ts" x="180.0" y="154" text-anchor="middle" dominant-baseline="central">altijd in de binary</text>
<rect class="box-green" x="60" y="190" width="240" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="180.0" y="218" text-anchor="middle" dominant-baseline="central">phoenix_tables.c</text>
<text class="ts" x="180.0" y="238" text-anchor="middle" dominant-baseline="central">gamecore, alle spellogica</text>
<text class="ts" x="180.0" y="254" text-anchor="middle" dominant-baseline="central">altijd in de binary</text>
<rect class="box-blue" x="380" y="90" width="240" height="80" rx="10" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="500.0" y="118" text-anchor="middle" dominant-baseline="central">graphics.rom + proms.rom</text>
<text class="ts" x="500.0" y="138" text-anchor="middle" dominant-baseline="central">alleen atlas-bake</text>
<text class="ts" x="500.0" y="154" text-anchor="middle" dominant-baseline="central">(build-tijd, niet in binary)</text>
<rect class="box-green" x="380" y="190" width="240" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="500.0" y="218" text-anchor="middle" dominant-baseline="central">phoenix_tables.c</text>
<text class="ts" x="500.0" y="238" text-anchor="middle" dominant-baseline="central">gedeelde gamecore</text>
<text class="ts" x="500.0" y="254" text-anchor="middle" dominant-baseline="central">altijd in de binary</text>
<text class="ts" x="340" y="304" text-anchor="middle" dominant-baseline="central">blauw = gegenereerde graphics-/paletassets &#183; groen = phoenix_tables.c &#183; gestippeld = alleen tijdens bouwen</text>
</svg>
