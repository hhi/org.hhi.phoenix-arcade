<svg width="100%" viewBox="0 0 680 434" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ROM provisioning and assembly</title>
<desc>Physical chip dumps go into roms/local; make romprepare validates and assembles them into roms/assembled with the three ROM images and derived C sources.</desc>
<style>
  :root {
    --box-fill: #eef1f4; --box-stroke: #94a3b8;
    --box-fill2: #dbeafe; --box-stroke2: #60a5fa;
    --box-fill3: #dcfce7; --box-stroke3: #4ade80;
    --text: #1a2129; --text-muted: #5b6b78; --line: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --box-fill: #1c2530; --box-stroke: #475569;
      --box-fill2: #1e3a5f; --box-stroke2: #60a5fa;
      --box-fill3: #14532d; --box-stroke3: #4ade80;
      --text: #e2e8f0; --text-muted: #94a3b8; --line: #94a3b8;
    }
  }
  .box { fill: var(--box-fill); stroke: var(--box-stroke); }
  .box-blue { fill: var(--box-fill2); stroke: var(--box-stroke2); }
  .box-green { fill: var(--box-fill3); stroke: var(--box-stroke3); }
  .th { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: var(--text); }
  .ts { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: var(--text-muted); }
  .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect class="box" x="180" y="40" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="59.0" text-anchor="middle" dominant-baseline="central">Physical chip dumps</text>
<text class="ts" x="340.0" y="77.0" text-anchor="middle" dominant-baseline="central">From your own cabinet or board</text>
<line x1="340" y1="96" x2="340" y2="146" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="180" y="146" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="165.0" text-anchor="middle" dominant-baseline="central">roms/local/</text>
<text class="ts" x="340.0" y="183.0" text-anchor="middle" dominant-baseline="central">14 files, named per rom-set.json</text>
<line x1="340" y1="202" x2="340" y2="252" class="arr" marker-end="url(#arrow)"/>
<rect class="box-blue" x="180" y="252" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="271.0" text-anchor="middle" dominant-baseline="central">make romprepare</text>
<text class="ts" x="340.0" y="289.0" text-anchor="middle" dominant-baseline="central">Validates, assembles, and derives C sources</text>
<line x1="340" y1="308" x2="340" y2="358" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="180" y="358" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="377.0" text-anchor="middle" dominant-baseline="central">roms/assembled/</text>
<text class="ts" x="340.0" y="395.0" text-anchor="middle" dominant-baseline="central">program.rom, graphics.rom, proms.rom</text>
</svg>
