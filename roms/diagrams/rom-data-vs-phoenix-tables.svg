<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Which binary needs which source file</title>
<desc>c-phoenix contains both rom_data.c and phoenix_tables.c in the compiled binary. c2-phoenix also fully contains phoenix_tables.c, but only reads rom_data.c at build time to bake the hi-res atlas; it is not part of the final c2 binary.</desc>
<style>
  :root {
    --box-fill: #eef1f4; --box-stroke: #94a3b8;
    --box-fill2: #dbeafe; --box-stroke2: #60a5fa;
    --box-fill3: #dcfce7; --box-stroke3: #4ade80;
    --text: #1a2129; --text-muted: #5b6b78; --line: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --box-fill: #1c2530; --box-stroke: #475569;
      --box-fill2: #1e3a5f; --box-stroke2: #60a5fa;
      --box-fill3: #14532d; --box-stroke3: #4ade80;
      --text: #e2e8f0; --text-muted: #94a3b8; --line: #94a3b8;
    }
  }
  .box { fill: var(--box-fill); stroke: var(--box-stroke); }
  .box-blue { fill: var(--box-fill2); stroke: var(--box-stroke2); }
  .box-green { fill: var(--box-fill3); stroke: var(--box-stroke3); }
  .th { font: 500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: var(--text); }
  .ts { font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: var(--text-muted); }
  .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect class="box" x="40" y="30" width="280" height="260" rx="20" stroke-width="0.5"/>
<text class="th" x="180" y="52" text-anchor="middle" dominant-baseline="central">c-phoenix</text>
<text class="ts" x="180" y="70" text-anchor="middle" dominant-baseline="central">authentic build</text>
<rect class="box" x="360" y="30" width="280" height="260" rx="20" stroke-width="0.5"/>
<text class="th" x="500" y="52" text-anchor="middle" dominant-baseline="central">c2-phoenix</text>
<text class="ts" x="500" y="70" text-anchor="middle" dominant-baseline="central">hi-res renderer build</text>
<rect class="box-blue" x="60" y="90" width="240" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="180.0" y="118" text-anchor="middle" dominant-baseline="central">rom_data.c</text>
<text class="ts" x="180.0" y="138" text-anchor="middle" dominant-baseline="central">renderer: gfx_mem + PROM</text>
<text class="ts" x="180.0" y="154" text-anchor="middle" dominant-baseline="central">always in the binary</text>
<rect class="box-green" x="60" y="190" width="240" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="180.0" y="218" text-anchor="middle" dominant-baseline="central">phoenix_tables.c</text>
<text class="ts" x="180.0" y="238" text-anchor="middle" dominant-baseline="central">gamecore, all game logic</text>
<text class="ts" x="180.0" y="254" text-anchor="middle" dominant-baseline="central">always in the binary</text>
<rect class="box-blue" x="380" y="90" width="240" height="80" rx="10" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="500.0" y="118" text-anchor="middle" dominant-baseline="central">rom_data.c</text>
<text class="ts" x="500.0" y="138" text-anchor="middle" dominant-baseline="central">atlas bake only</text>
<text class="ts" x="500.0" y="154" text-anchor="middle" dominant-baseline="central">(build time, not in binary)</text>
<rect class="box-green" x="380" y="190" width="240" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="500.0" y="218" text-anchor="middle" dominant-baseline="central">phoenix_tables.c</text>
<text class="ts" x="500.0" y="238" text-anchor="middle" dominant-baseline="central">shared gamecore</text>
<text class="ts" x="500.0" y="254" text-anchor="middle" dominant-baseline="central">always in the binary</text>
<text class="ts" x="340" y="304" text-anchor="middle" dominant-baseline="central">blue = rom_data.c &#183; green = phoenix_tables.c &#183; dashed = build-time only</text>
</svg>
