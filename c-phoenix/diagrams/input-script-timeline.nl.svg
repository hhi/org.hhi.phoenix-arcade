<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Een invoerscript uitgelegd: elke regel is één knopgebeurtenis, vastgezet op een exact framenummer. Het diagram toont een tijdlijn van frame 200 tot 1000 met munt-, start- en vuurgebeurtenissen, met daaronder de bijbehorende regels uit het tekstbestand.">
  <title>Wat een invoerscript is</title>
  <style>
    .bg   { fill:#050510; }
    .h1   { fill:#E8E8FF; font-family:'Segoe UI',system-ui,sans-serif; font-size:18px; font-weight:600; }
    .sub  { fill:#8888AA; font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; }
    .axis { fill:none; stroke:#3A3A62; stroke-width:2; }
    .tick { fill:none; stroke:#2A2A4A; stroke-width:1; }
    .fnum { fill:#6E6E90; font-family:monospace; font-size:10.5px; }
    .ev   { font-family:monospace; font-size:11px; }
    .hold { stroke-width:7; stroke-linecap:round; opacity:.85; }
    .code { fill:#0C0C1E; stroke:#2A2A4A; stroke-width:1.5; }
    .line { font-family:monospace; font-size:12px; }
    .note { fill:#777799; font-family:'Segoe UI',system-ui,sans-serif; font-size:11.5px; }
    .cap  { fill:#AAAACC; font-family:'Segoe UI',system-ui,sans-serif; font-size:11.5px; }

    @keyframes play { 0%{transform:translateX(0)} 100%{transform:translateX(600px)} }
    .head { animation: play 6s infinite linear; }
    @media (prefers-reduced-motion: reduce) { .head { animation: none; opacity:0; } }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="340" rx="10" />

  <text class="h1"  x="26" y="32">Een invoerscript is een lijst knopindrukken met tijdstempels</text>
  <text class="sub" x="26" y="52">Het tijdstempel is een framenummer. De knopnamen zijn letterlijk, in het Engels, zoals het bestand ze verwacht.</text>

  <!-- timeline -->
  <line class="axis" x1="80" y1="150" x2="700" y2="150" />
  <g class="fnum">
    <text x="80"  y="172" text-anchor="middle">frame 200</text>
    <text x="235" y="172" text-anchor="middle">400</text>
    <text x="390" y="172" text-anchor="middle">600</text>
    <text x="545" y="172" text-anchor="middle">800</text>
    <text x="700" y="172" text-anchor="middle">1000</text>
  </g>
  <g class="tick">
    <line x1="80"  y1="145" x2="80"  y2="155" />
    <line x1="235" y1="145" x2="235" y2="155" />
    <line x1="390" y1="145" x2="390" y2="155" />
    <line x1="545" y1="145" x2="545" y2="155" />
    <line x1="700" y1="145" x2="700" y2="155" />
  </g>

  <!-- playhead -->
  <g class="head">
    <line x1="80" y1="96" x2="80" y2="158" stroke="#FFFF66" stroke-width="1.5" opacity=".7" />
    <circle cx="80" cy="150" r="4" fill="#FFFF66" />
  </g>

  <!-- events: coin -->
  <line class="hold" x1="91" y1="126" x2="103" y2="126" stroke="#00FFCC" />
  <text class="ev" x="97" y="116" fill="#00FFCC" text-anchor="middle">coin</text>
  <line class="tick" x1="97" y1="130" x2="97" y2="146" />

  <!-- start1: press 203 release 220 -->
  <line class="hold" x1="102" y1="126" x2="115" y2="126" stroke="#66DDFF" />
  <text class="ev" x="140" y="106" fill="#66DDFF" text-anchor="middle">start1</text>
  <line class="tick" x1="115" y1="118" x2="132" y2="108" />

  <!-- fire: held 841-850 -->
  <line class="hold" x1="577" y1="126" x2="584" y2="126" stroke="#FF00AA" />
  <text class="ev" x="580" y="116" fill="#FF00AA" text-anchor="middle">fire</text>
  <line class="tick" x1="580" y1="130" x2="580" y2="146" />

  <!-- left held 500-620 -->
  <line class="hold" x1="313" y1="126" x2="406" y2="126" stroke="#FFAA33" />
  <text class="ev" x="360" y="116" fill="#FFAA33" text-anchor="middle">left  (ingedrukt)</text>
  <line class="tick" x1="313" y1="130" x2="313" y2="146" />
  <line class="tick" x1="406" y1="130" x2="406" y2="146" />

  <text class="cap" x="80" y="196">Een dikke balk betekent: knop ingedrukt. Eén regel drukt in, een andere laat los — er is geen automatische release.</text>

  <!-- the file -->
  <rect class="code" x="80" y="212" width="290" height="94" rx="6" />
  <text class="fnum" x="92" y="230">het bestand op schijf</text>
  <text class="line" x="92" y="250"><tspan fill="#FFFF66">203</tspan>  <tspan fill="#66DDFF">start1</tspan>  <tspan fill="#DDDDEE">press</tspan></text>
  <text class="line" x="92" y="268"><tspan fill="#FFFF66">220</tspan>  <tspan fill="#66DDFF">start1</tspan>  <tspan fill="#DDDDEE">release</tspan></text>
  <text class="line" x="92" y="286"><tspan fill="#FFFF66">841</tspan>  <tspan fill="#FF00AA">fire</tspan>    <tspan fill="#DDDDEE">press</tspan></text>
  <text class="line" x="92" y="304"><tspan fill="#FFFF66">850</tspan>  <tspan fill="#FF00AA">fire</tspan>    <tspan fill="#DDDDEE">release</tspan></text>

  <text class="fnum" x="390" y="230" fill="#8888AA">wat elke kolom betekent</text>
  <text class="note" x="390" y="250"><tspan fill="#FFFF66" font-family="monospace">frame</tspan>   op welk frame het gebeurt</text>
  <text class="note" x="390" y="268"><tspan fill="#66DDFF" font-family="monospace">knop</tspan>    coin · start1 · start2 · fire · left · right · shield</text>
  <text class="note" x="390" y="286"><tspan fill="#DDDDEE" font-family="monospace">actie</tspan>   press (indrukken) of release (loslaten)</text>
  <text class="note" x="390" y="304">Lege regels en regels die met # beginnen worden genegeerd.</text>
</svg>
