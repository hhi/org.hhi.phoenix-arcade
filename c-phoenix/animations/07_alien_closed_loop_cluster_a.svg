<svg width="380" height="180" viewBox="0 0 380 180" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .grid { fill:none; stroke:#222244; stroke-width:1; stroke-dasharray:2 2; }
    .path { fill:none; stroke:#00FFCC; stroke-width:2; stroke-dasharray:4 4; opacity: 0.6; }
    .alien { fill:#00FFCC; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }

    @keyframes alienLoopClusterA {
      0% { transform: translate(50px, 40px); }
      25% { transform: translate(120px, 60px); }
      50% { transform: translate(190px, 120px); }
      75% { transform: translate(260px, 70px); }
      100% { transform: translate(320px, 40px); }
    }
    .anim-alien { animation: alienLoopClusterA 6s infinite ease-in-out; }
  </style>

  <text x="15" y="25" class="label">Alien Cluster A: Closed-Loop Swoop (ROM $1000)</text>
  
  <!-- Formation Grid Line -->
  <line x1="30" y1="40" x2="350" y2="40" class="grid" />
  
  <!-- Prescribed Vector Path -->
  <path d="M 50,40 C 120,60 150,140 190,120 C 230,100 260,70 320,40" class="path" />
  
  <!-- Swooping Alien -->
  <g class="anim-alien">
    <rect x="-12" y="-6" width="24" height="12" class="alien" />
    <rect x="-4" y="6" width="8" height="6" class="alien" />
  </g>
</svg>
