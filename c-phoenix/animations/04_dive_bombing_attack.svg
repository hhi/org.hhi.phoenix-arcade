<svg width="380" height="160" viewBox="0 0 380 160" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .path { fill:none; stroke:#FF00AA; stroke-width:2; stroke-dasharray:4 4; opacity: 0.4; }
    .bird { fill:#FF00AA; }
    .bomb { fill:#FFFF00; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }

    @keyframes birdFlight {
      0% { transform: translate(40px, 40px); }
      35% { transform: translate(140px, 45px); }
      70% { transform: translate(220px, 90px); }
      100% { transform: translate(320px, 140px); }
    }
    @keyframes bombFall {
      0% { transform: translate(0px, 0px); opacity: 1; }
      100% { transform: translate(0px, 60px); opacity: 0; }
    }
    .anim-bird { animation: birdFlight 5.5s infinite ease-in-out; }
    .anim-bomb { animation: bombFall 1.5s infinite linear; }
  </style>
  <text x="15" y="25" class="label">Dive-Bombing Trajectory &amp; Bomb Drop</text>
  
  <!-- Sinus Flight Path -->
  <path d="M 40,40 Q 140,40 180,85 T 320,140" class="path" />
  
  <!-- Diving Bird -->
  <g class="anim-bird">
    <rect x="-14" y="-6" width="28" height="12" class="bird" />
    <rect x="-6" y="6" width="12" height="6" class="bird" />
    <!-- Dropping Bomb -->
    <rect x="-2" y="12" width="4" height="8" class="bomb anim-bomb" />
  </g>
</svg>
