<text class="sub" x="20" y="50">6 poses of 1x2 characters, read out of the screen memory of a recorded session.</text>
<text class="sub" x="20" y="66">No table holds this size: sprite_rendering.c picks 1x1, 2x1, 1x2 or 2x2 at runtime from the object's control byte.</text>
<text class="grp" x="20" y="84">1x2 block · 2 characters · foreground set</text>
<text class="src" x="20" y="100">sprite_rendering.c: bit3_controller() calls execute_bit3_function(control &amp; 0x07), which picks the size</text>
