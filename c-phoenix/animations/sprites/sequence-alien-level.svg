<svg width="735" height="260" viewBox="0 0 735 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poses of the Phoenix formation alien flying level, each 2 by 1 characters, with the character codes listed.">
<title>The formation alien, flying level</title>
<style>
  .bg{fill:#050510} .cell{fill:#0C0C1E;stroke:#242440;stroke-width:1}
  .h1{fill:#E8E8FF;font-family:'Segoe UI',system-ui,sans-serif;font-size:17px;font-weight:600}
  .sub{fill:#8888AA;font-family:'Segoe UI',system-ui,sans-serif;font-size:11.5px}
