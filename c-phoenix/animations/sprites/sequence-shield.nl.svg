<text class="h1" x="20" y="30">Het spelerschild, zoals getekend in de opname</text>
<text class="sub" x="20" y="50">1 blokken van 4x4 karakters, geclusterd uit het opgenomen schermgeheugen.</text>
<text class="sub" x="20" y="66">Afgelezen uit een sessie in plaats van een tabel, omdat de blokgrootte tijdens runtime wordt bepaald.</text>
<text class="grp" x="20" y="84">4x4-blok · 16 karakters · voorgrondset</text>
<text class="src" x="20" y="100">player_logic.c: move_player() roept draw_shields() aan (b=4, c=4) — vormen uit phoenix_shield_table</text>
