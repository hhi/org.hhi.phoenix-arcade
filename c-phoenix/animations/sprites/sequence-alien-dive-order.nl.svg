</style>
<rect class="bg" x="0" y="0" width="1113" height="306" rx="8"/>
<text class="h1" x="20" y="30">Eén alien, één duik, op volgorde</text>
<text class="sub" x="20" y="50">Hetzelfde object frame voor frame gevolgd terwijl het de formatie verlaat en op de speler duikt.</text>
<text class="sub" x="20" y="66">De blokgrootte wisselt tijdens de duik: 1x1 → 2x1 → 1x1 → 2x1 → 1x1 → 2x1 → 1x1 → 2x1 → 1x1 → 2x2 → 1x1 → 1x2. Smallere poses zijn hier in een 2x2-cel gezet zodat ze uitlijnen.</text>
<text class="grp" x="20" y="84">gevolgd door een opgenomen sessie · maten wisselen per pose</text>
<text class="src" x="20" y="100">sprite_rendering.c: execute_bit3_function() kent de gevallen 0/1/3/4 — 1x1, 2x1, 1x2, 2x2</text>
