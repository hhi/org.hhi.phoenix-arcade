<svg width="1113" height="306" viewBox="0 0 1113 306" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eén Phoenix-alien gevolgd door een duik, met wisselende pose en blokgrootte op volgorde.">
<title>Eén alien, één duik, op volgorde</title>
<style>
  .bg{fill:#050510} .cell{fill:#0C0C1E;stroke:#242440;stroke-width:1}
  .h1{fill:#E8E8FF;font-family:'Segoe UI',system-ui,sans-serif;font-size:17px;font-weight:600}
  .sub{fill:#8888AA;font-family:'Segoe UI',system-ui,sans-serif;font-size:11.5px}
  .idx{fill:#FFFF66;font-family:monospace;font-size:9.5px}
  .lbl{fill:#AAAACC;font-family:'Segoe UI',system-ui,sans-serif;font-size:10.5px}
