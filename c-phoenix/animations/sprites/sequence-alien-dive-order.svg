<svg width="1058" height="306" viewBox="0 0 1058 306" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One Phoenix alien followed through a dive, showing its pose and block size changing in sequence.">
<title>One alien, one dive, in order</title>
<style>
  .bg{fill:#050510} .cell{fill:#0C0C1E;stroke:#242440;stroke-width:1}
  .h1{fill:#E8E8FF;font-family:'Segoe UI',system-ui,sans-serif;font-size:17px;font-weight:600}
