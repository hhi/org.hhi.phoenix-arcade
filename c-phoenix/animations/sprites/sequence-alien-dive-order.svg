<rect class="bg" x="0" y="0" width="1058" height="306" rx="8"/>
<text class="h1" x="20" y="30">One alien, one dive, in order</text>
<text class="sub" x="20" y="50">The same object followed frame by frame as it leaves the formation and drops on the player.</text>
<text class="sub" x="20" y="66">Its block size changes mid-dive: 1x2 → 2x2 → 1x1 → 2x2 → 1x2 → 2x2 → 1x1 → 2x2 → 1x2 → 2x2 → 1x1 → 2x2. Narrower poses are padded into a 2x2 cell here so they line up.</text>
<text class="grp" x="20" y="84">tracked through a recorded session · sizes change per pose</text>
<text class="src" x="20" y="100">sprite_rendering.c: execute_bit3_function() handles cases 0/1/3/4 — 1x1, 2x1, 1x2, 2x2</text>
