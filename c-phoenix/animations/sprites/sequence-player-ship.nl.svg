<text class="note" x="20" y="254">Het spel tekent nooit een schip. Het schrijft karaktercodes naar het schermgeheugen en de hardware haalt de pixels op.</text>
<text class="note" x="20" y="271">De blokgrootte kiest het spel tijdens runtime uit het control-byte, hij staat niet in de tabel; 2x2 is de maat waarin deze vier regels samenhangend renderen.</text>
<text class="note" x="20" y="288">Alle vier komen uit kleurgroep 1 en 2, en daarom is het schip altijd rood, wit en geel.</text>
</svg>
