<svg width="997" height="306" viewBox="0 0 997 306" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="De acht poses van het Phoenix-spelerschip, elk opgebouwd uit vier 8x8-karakters in een 2x2-blok, met de karaktercodes erbij.">
<title>Het spelerschip, pose voor pose</title>
