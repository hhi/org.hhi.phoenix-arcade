<text class="h1" x="20" y="30">Het spelerschip, pose voor pose</text>
<text class="sub" x="20" y="50">Acht poses. Elk vier karakters uit phoenix_sprite_character_block_shapes, getekend als een 2x2-blok.</text>
<text class="sub" x="20" y="66">De codes worden per twee gelezen: elk paar vult een kolom van boven naar beneden, daarna stapt de routine naar de volgende kolom.</text>
<text class="grp" x="20" y="84">getekend door de 2x2-routine · 4 karakters · 16 x 16 pixels</text>
