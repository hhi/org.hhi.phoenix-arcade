<text class="h1" x="20" y="30">The bonus explosion, left half and right half</text>
<text class="sub" x="20" y="50">Two fixed addresses in alien_logic.c - 0x17D0 and 0x17D6 - each drawn with the same 3x2 routine.</text>
<text class="sub" x="20" y="66">Neither half is a sprite on its own; the game places them side by side to make one wide explosion.</text>
<text class="grp" x="20" y="84">drawNx2 with n=3, twice · 12 characters total</text>
<text class="src" x="20" y="100">alien_logic.c: l3796_bonus_explosion_left/l3758_bonus_explosion_right call drawNx2(0x17D0 and 0x17D6, hl, 0xFFDF, 3)</text>
