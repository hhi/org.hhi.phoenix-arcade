<svg width="360" height="190" viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .grid { fill:none; stroke:#222244; stroke-width:1; stroke-dasharray:2 2; }
    .path { fill:none; stroke:#FF00AA; stroke-width:2; stroke-dasharray:4 4; opacity:0.6; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }
    .player { fill: #00FFCC; }
  </style>

  <text x="15" y="22" class="label">Script 15: Mothership Terminal Dive</text>
  <text x="15" y="38" class="label">ROM $3F78: Speed=0x10, Param=0x10, Phase=0x07</text>
  
  <!-- Player Ship Reference Line at bottom -->
  <line x1="20" y1="175" x2="340" y2="175" class="grid" />
  <rect x="170" y="168" width="20" height="7" class="player" />

  <!-- Prescribed AI Path -->
  <path d="M 50,45 Q 170,45 200,100 T 320,165" class="path" />
  
  <!-- Bird entity following path -->
  <g>
    <animateMotion path="M 50,45 Q 170,45 200,100 T 320,165" dur="5.5s" repeatCount="indefinite" rotate="auto" />
    <g>
      <rect x="-14" y="-7" width="28" height="14" fill="#FF00AA" />
      <rect x="-4" y="7" width="8" height="6" fill="#FF00AA" />
      <rect x="-2" y="13" width="4" height="8" fill="#FFFF00"><animate attributeName="y" values="13;60;100" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.5s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>