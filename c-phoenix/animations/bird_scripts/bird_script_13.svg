<svg width="360" height="190" viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .grid { fill:none; stroke:#222244; stroke-width:1; stroke-dasharray:2 2; }
    .path { fill:none; stroke:#00E5FF; stroke-width:2; stroke-dasharray:4 4; opacity:0.6; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }
    .player { fill: #00FFCC; }
  </style>

  <text x="15" y="22" class="label">Script 13: Mothership Escort Form 2</text>
  <text x="15" y="38" class="label">ROM $3F68: Speed=0xFF, Param=0xFF, Phase=0xFF</text>
  
  <!-- Player Ship Reference Line at bottom -->
  <line x1="20" y1="175" x2="340" y2="175" class="grid" />
  <rect x="170" y="168" width="20" height="7" class="player" />

  <!-- Prescribed AI Path -->
  <path d="M 40,40 L 300,40 L 300,100 L 40,100 Z" class="path" />
  
  <!-- Bird entity following path -->
  <g>
    <animateMotion path="M 40,40 L 300,40 L 300,100 L 40,100 Z" dur="5.5s" repeatCount="indefinite" rotate="auto" />
    <g>
      <rect x="-12" y="-6" width="24" height="12" fill="#00E5FF" />
      <rect x="-4" y="6" width="8" height="4" fill="#00E5FF" />
    </g>
  </g>
</svg>