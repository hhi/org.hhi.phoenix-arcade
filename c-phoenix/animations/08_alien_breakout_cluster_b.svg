<svg width="380" height="180" viewBox="0 0 380 180" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .path { fill:none; stroke:#FFCC00; stroke-width:2; stroke-dasharray:4 4; opacity: 0.6; }
    .alien-break { fill:#FFCC00; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }

    @keyframes alienBreakoutB {
      0% { transform: translate(190px, 35px); }
      30% { transform: translate(90px, 85px); }
      60% { transform: translate(190px, 145px); }
      85% { transform: translate(290px, 85px); }
      100% { transform: translate(190px, 35px); }
    }
    .anim-breakout { animation: alienBreakoutB 5.5s infinite ease-in-out; }
  </style>

  <text x="15" y="25" class="label">Alien Cluster B: Breakout &amp; Escort Attack (ROM $2C00)</text>
  
  <!-- Loop Path -->
  <path d="M 190,35 C 90,85 100,145 190,145 C 280,145 290,85 190,35" class="path" />
  
  <!-- Breakout Alien -->
  <g class="anim-breakout">
    <rect x="-14" y="-8" width="28" height="14" class="alien-break" />
    <rect x="-6" y="6" width="12" height="6" class="alien-break" />
  </g>
</svg>
