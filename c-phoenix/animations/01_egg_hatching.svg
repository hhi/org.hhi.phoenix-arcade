<svg width="340" height="150" viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .egg-shell { fill: #FFFF55; }
    .hatching { fill: #FF0055; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }
    
    @keyframes smoothWobble {
      0%, 25% { transform: translate(35px, 45px) rotate(0deg); opacity: 1; }
      5%, 15% { transform: translate(35px, 45px) rotate(-4deg); opacity: 1; }
      10%, 20% { transform: translate(35px, 45px) rotate(4deg); opacity: 1; }
      30%, 40% { transform: translate(35px, 45px) scale(1); opacity: 1; }
      48%, 85% { transform: translate(35px, 45px) scale(0.7); opacity: 0; }
      92%, 100% { transform: translate(35px, 45px) scale(1); opacity: 1; }
    }

    @keyframes smoothHatch {
      0%, 35% { transform: translate(210px, 45px) scale(0.6); opacity: 0; }
      45% { transform: translate(210px, 40px) scale(1.1); opacity: 1; }
      55%, 80% { transform: translate(210px, 45px) scale(1); opacity: 1; }
      90%, 100% { transform: translate(210px, 45px) scale(0.6); opacity: 0; }
    }

    .anim-egg { animation: smoothWobble 5.5s infinite ease-in-out; transform-origin: 55px 65px; }
    .anim-bird { animation: smoothHatch 5.5s infinite ease-in-out; transform-origin: 230px 65px; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#00FFCC" />
    </marker>
  </defs>

  <!-- Ei (Egg) -->
  <text x="25" y="25" class="label">1. Ei-vorm (Type 0x0B)</text>
  <g class="anim-egg">
    <rect x="12" y="0" width="16" height="8" class="egg-shell" />
    <rect x="4" y="8" width="32" height="8" class="egg-shell" />
    <rect x="0" y="16" width="40" height="16" class="egg-shell" />
    <rect x="4" y="32" width="32" height="8" class="egg-shell" />
    <rect x="12" y="40" width="16" height="8" class="egg-shell" />
  </g>

  <!-- Pijl -->
  <line x1="120" y1="70" x2="180" y2="70" stroke="#00FFCC" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Uitkomen (Hatching) -->
  <text x="200" y="25" class="label">2. Transformatie (Vogel)</text>
  <g class="anim-bird">
    <rect x="8" y="0" width="24" height="8" class="hatching" />
    <rect x="0" y="8" width="40" height="16" class="hatching" />
    <rect x="8" y="24" width="24" height="16" class="hatching" />
    <rect x="16" y="40" width="8" height="8" class="hatching" />
  </g>
</svg>
