<svg width="360" height="190" viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .grid { fill:none; stroke:#222244; stroke-width:1; stroke-dasharray:2 2; }
    .dive-line { fill:none; stroke:#FFCC00; stroke-width:2; stroke-dasharray:4 4; opacity:0.7; }
    .spawn-marker { fill:#00FFCC; stroke:#FFFF00; stroke-width:1.5; }
    .player { fill:#00FFCC; }
    .bird { fill:#FFCC00; }
    .bomb { fill:#FF0055; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }
  </style>

  <text x="15" y="22" class="label">Bird Dive Launch 04 (ROM $3DC8)</text>
  <text x="15" y="38" class="label">Spawn Grid Pos: X=8 (0x08), Y=112 (0x70) &gt; Player Target X=128</text>
  
  <!-- Formation Top Grid -->
  <line x1="20" y1="40" x2="340" y2="40" class="grid" />
  <!-- Player Floor Line -->
  <line x1="20" y1="170" x2="340" y2="170" class="grid" />
  
  <!-- Player Ship Target -->
  <rect x="118.0" y="163" width="20" height="7" class="player" />

  <!-- Spawn Launch Point Marker -->
  <circle cx="310.0" cy="40.0" r="5" class="spawn-marker" />

  <!-- Aimed Dive Trajectory Path -->
  <path d="M 310.0,40.0 Q 219.0,105.0 128.0,170" class="dive-line" />
  
  <!-- Diving Bird &amp; Dropping Bomb -->
  <g>
    <animateMotion path="M 310.0,40.0 Q 219.0,105.0 128.0,170" dur="4.5s" repeatCount="indefinite" rotate="auto" />
    <g transform="translate(-10, -5)">
      <rect x="0" y="0" width="20" height="10" class="bird" />
      <rect x="5" y="10" width="10" height="4" class="bird" />
      <rect x="8" y="14" width="4" height="6" class="bomb">
        <animate attributeName="y" values="14;50;90" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;1;0" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>