<svg width="420" height="220" viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .grid { fill:none; stroke:#222244; stroke-width:1; stroke-dasharray:2 2; }
    .alien-path { fill:none; stroke:#00FFCC; stroke-width:2; stroke-dasharray:4 4; opacity: 0.5; }
    .bird-path { fill:none; stroke:#FF00AA; stroke-width:2; stroke-dasharray:4 4; opacity: 0.5; }
    .ship-path { fill:none; stroke:#00FF66; stroke-width:2; stroke-dasharray:4 4; opacity: 0.5; }
    
    .alien { fill:#00FFCC; }
    .bird { fill:#FF00AA; }
    .bomb { fill:#FFFF00; }
    .ship { fill:#00FF66; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }

    @keyframes alienMasterLoop {
      0% { transform: translate(30px, 45px); }
      30% { transform: translate(110px, 75px); }
      60% { transform: translate(180px, 130px); }
      85% { transform: translate(250px, 80px); }
      100% { transform: translate(300px, 45px); }
    }
    @keyframes birdMasterLoop {
      0% { transform: translate(220px, 45px); }
      40% { transform: translate(140px, 110px); }
      80% { transform: translate(60px, 175px); opacity: 1; }
      100% { transform: translate(60px, 195px); opacity: 0; }
    }
    @keyframes bombMasterDrop {
      0% { transform: translate(0px, 0px); opacity: 1; }
      100% { transform: translate(0px, 50px); opacity: 0; }
    }
    @keyframes mothershipMasterDescent {
      0% { transform: translate(310px, 10px); }
      70% { transform: translate(310px, 110px); }
      100% { transform: translate(310px, 10px); }
    }

    .anim-alien { animation: alienMasterLoop 6s infinite ease-in-out; }
    .anim-bird { animation: birdMasterLoop 5s infinite ease-in-out; }
    .anim-bomb { animation: bombMasterDrop 1.5s infinite linear; }
    .anim-ship { animation: mothershipMasterDescent 9s infinite ease-in-out; }
  </style>

  <text x="15" y="22" class="label">Phoenix Master Flight Path Overview (Z80 Vector Engine)</text>
  
  <!-- Formation Top Grid -->
  <line x1="20" y1="45" x2="400" y2="45" class="grid" />

  <!-- Paths -->
  <path d="M 30,45 C 110,75 150,150 180,130 C 210,110 250,80 300,45" class="alien-path" />
  <path d="M 220,45 Q 140,110 60,185" class="bird-path" />
  <line x1="350" y1="10" x2="350" y2="190" class="ship-path" />

  <!-- Animated Alien (Cluster A/B Vector Swoop) -->
  <g class="anim-alien">
    <rect x="-10" y="-5" width="20" height="10" class="alien" />
    <rect x="-4" y="5" width="8" height="4" class="alien" />
  </g>

  <!-- Animated Bird (Sinus Dive-Bomb & Bomb Drop) -->
  <g class="anim-bird">
    <rect x="-12" y="-6" width="24" height="12" class="bird" />
    <rect x="-4" y="6" width="8" height="4" class="bird" />
    <rect x="-2" y="10" width="4" height="8" class="bomb anim-bomb" />
  </g>

  <!-- Animated Mothership (Descent Trajectory) -->
  <g class="anim-ship">
    <rect x="-35" y="0" width="70" height="10" class="ship" />
    <rect x="-20" y="10" width="40" height="8" class="ship" />
    <rect x="-8" y="18" width="16" height="8" fill="#FF0055" />
  </g>
</svg>
