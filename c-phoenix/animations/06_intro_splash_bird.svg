<svg width="340" height="140" viewBox="0 0 340 140" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .intro-bird { fill: #00E5FF; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }

    @keyframes introGlideSmooth {
      0% { transform: translate(-100px, 50px); }
      50% { transform: translate(120px, 38px); }
      100% { transform: translate(350px, 50px); }
    }
    .anim-intro { animation: introGlideSmooth 7.5s infinite ease-in-out; }
  </style>
  <text x="15" y="25" class="label">Intro Splash Bird (Attract Mode)</text>
  <g class="anim-intro">
    <rect x="24" y="0" width="72" height="8" class="intro-bird" />
    <rect x="8" y="8" width="104" height="16" class="intro-bird" />
    <rect x="40" y="24" width="40" height="16" class="intro-bird" />
    <rect x="48" y="40" width="24" height="8" class="intro-bird" />
  </g>
</svg>
