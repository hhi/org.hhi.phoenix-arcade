<svg width="340" height="140" viewBox="0 0 340 140" xmlns="http://www.w3.org/2000/svg" style="background:#050510; border-radius:8px;">
  <style>
    .particle { fill: #FF9900; }
    .score-text { fill: #00FFFF; font-family: monospace; font-size: 26px; font-weight: bold; }
    .label { fill: #8888AA; font-family: monospace; font-size: 11px; }

    @keyframes particleBurst {
      0% { transform: translate(70px, 70px) scale(0.1) rotate(0deg); opacity: 1; }
      40% { transform: translate(70px, 70px) scale(1.3) rotate(45deg); opacity: 0.9; }
      80%, 100% { transform: translate(70px, 70px) scale(2.2) rotate(90deg); opacity: 0; }
    }
    @keyframes scoreFloat {
      0%, 35% { transform: translate(175px, 95px); opacity: 0; }
      50%, 80% { transform: translate(175px, 75px); opacity: 1; }
      100% { transform: translate(175px, 55px); opacity: 0; }
    }
    .anim-burst { animation: particleBurst 4.5s infinite ease-out; transform-origin: 0px 0px; }
    .anim-score { animation: scoreFloat 4.5s infinite ease-in-out; }
  </style>
  <text x="15" y="25" class="label">Deeltjes-Explosie &amp; Score Weergave</text>
  
  <!-- Explosion Particles -->
  <g class="anim-burst">
    <rect x="-25" y="-25" width="6" height="6" class="particle" />
    <rect x="20" y="-15" width="6" height="6" class="particle" />
    <rect x="-15" y="20" width="6" height="6" class="particle" />
    <rect x="25" y="25" width="6" height="6" class="particle" />
    <rect x="0" y="-30" width="6" height="6" class="particle" />
    <rect x="0" y="30" width="6" height="6" class="particle" />
  </g>

  <!-- Floating Score -->
  <g class="anim-score">
    <text x="0" y="0" class="score-text">500</text>
  </g>
</svg>
